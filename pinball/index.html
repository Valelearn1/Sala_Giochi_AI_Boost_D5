<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Profondità Zero: flipper a turni da 1 a 4 giocatori sullo stesso dispositivo." />
    <meta name="theme-color" content="#04163a" />
    <title>Profondità Zero · Sala giochi</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Matter.js (fisica) in locale: script classico, deve venire prima del modulo -->
    <script src="lib/matter.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="back-link" href="../">‹ Tutti i giochi</a>
      <h1 class="table-name">Profondità Zero</h1>
    </header>

    <main class="game">
      <div class="table-area">
        <div id="table-wrap" class="table-wrap">
          <canvas id="table" aria-label="Tavolo del flipper"></canvas>
        </div>
        <button type="button" id="launch-button" class="launch-button">Lancia</button>
      </div>

      <aside id="hud" class="hud" aria-label="Punteggi">
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <button type="button" id="pause-button" class="pause-button">Pausa</button>
      </aside>
    </main>
  </body>
</html>
